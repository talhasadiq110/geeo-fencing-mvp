name: AmigoFeasibility
options:
  bundleIdPrefix: com.talha
  createIntermediateGroups: true
targets:
  AmigoFeasibility:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: AmigoFeasibility/Sources
      - path: AmigoFeasibility/Resources/Info.plist
    settings:
      base:
        PRODUCT_NAME: AmigoFeasibility
        PRODUCT_BUNDLE_IDENTIFIER: com.talha.amigo.feasibility
        INFOPLIST_FILE: AmigoFeasibility/Resources/Info.plist
        SWIFT_VERSION: "5.9"
        GENERATE_INFOPLIST_FILE: false
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: V8YHVJVPD9
        CODE_SIGNING_ALLOWED: YES
        CODE_SIGNING_REQUIRED: YES
        CODE_SIGN_IDENTITY: "Apple Development"

  AmigoFeasibilityTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: AmigoFeasibility/Tests
    dependencies:
      - target: AmigoFeasibility
    settings:
      base:
        PRODUCT_NAME: AmigoFeasibilityTests
        SWIFT_VERSION: "5.9"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: V8YHVJVPD9
        CODE_SIGNING_ALLOWED: YES
        CODE_SIGNING_REQUIRED: YES
        CODE_SIGN_IDENTITY: "Apple Development"

schemes:
  AmigoFeasibility:
    build:
      targets:
        AmigoFeasibility: all
        AmigoFeasibilityTests: [test]
    test:
      targets:
        - name: AmigoFeasibilityTests
